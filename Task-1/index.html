<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Taskify - To-Do List</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>

    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar">

        <div class="logo">
            <div class="logo-icon">✓</div>

            <div>
                <h2>Taskify</h2>
                <p>Organize your day</p>
            </div>
        </div>


        <nav class="sidebar-nav">

            <button class="nav-item active"
                    data-filter="all">

                <span>▦</span>
                <span>All Tasks</span>
                <b id="allCount">0</b>

            </button>


            <button class="nav-item"
                    data-filter="today">

                <span>📅</span>
                <span>Today</span>
                <b id="todayCount">0</b>

            </button>


            <button class="nav-item"
                    data-filter="pending">

                <span>🕐</span>
                <span>Pending</span>
                <b id="pendingSideCount">0</b>

            </button>


            <button class="nav-item"
                    data-filter="completed">

                <span>✓</span>
                <span>Completed</span>
                <b id="completedSideCount">0</b>

            </button>


            <button class="nav-item"
                    data-filter="important">

                <span>⭐</span>
                <span>Important</span>
                <b id="importantCount">0</b>

            </button>

        </nav>


        <!-- CATEGORIES -->

        <div class="categories">

            <div class="category-title">

                <span>CATEGORIES</span>

                <button id="addCategory">
                    +
                </button>

            </div>


            <button class="category-item"
                    data-category="Work">

                💼
                <span>Work</span>

            </button>


            <button class="category-item"
                    data-category="Study">

                📚
                <span>Study</span>

            </button>


            <button class="category-item"
                    data-category="Personal">

                👤
                <span>Personal</span>

            </button>


            <button class="category-item"
                    data-category="Health">

                💗
                <span>Health</span>

            </button>

        </div>


        <div class="sidebar-bottom">

            <button id="themeToggle"
                    class="theme-button">

                🌙
                <span>Dark Mode</span>

                <span class="toggle">
                    <span></span>
                </span>

            </button>

        </div>

    </aside>


    <!-- ================= MAIN ================= -->

    <main class="main-content">


        <!-- HEADER -->

        <header class="top-header">

            <div>

                <h1>
                    Good Morning,
                    <span>Rajani!</span> 🌻
                </h1>

                <p>
                    Let's make today productive and amazing!
                </p>

            </div>


            <button id="mobileMenu"
                    class="mobile-menu">

                ☰

            </button>


            <button id="headerTheme"
                    class="header-theme">

                ☀️

            </button>

        </header>


        <!-- ================= ADD TASK ================= -->

        <section class="add-task-card">

            <h2>
                📝 Add New Task
            </h2>


            <div class="task-input-row">

                <input
                    type="text"
                    id="taskInput"
                    placeholder="What do you want to do?"
                >


                <button id="addTaskBtn">

                    Add Task
                    <span>＋</span>

                </button>

            </div>


            <div class="task-options">

                <select id="categoryInput">

                    <option value="">
                        Select Category
                    </option>

                    <option value="Work">
                        Work
                    </option>

                    <option value="Study">
                        Study
                    </option>

                    <option value="Personal">
                        Personal
                    </option>

                    <option value="Health">
                        Health
                    </option>

                </select>


                <select id="priorityInput">

                    <option value="">
                        Select Priority
                    </option>

                    <option value="High">
                        🔴 High
                    </option>

                    <option value="Medium">
                        🟡 Medium
                    </option>

                    <option value="Low">
                        🟢 Low
                    </option>

                </select>


                <input
                    type="date"
                    id="dateInput"
                >

            </div>


            <p id="errorMessage"
               class="error-message">
            </p>

        </section>


        <!-- ================= STATISTICS ================= -->

        <section class="stats">

            <div class="stat-card total">

                <div class="stat-icon">
                    📋
                </div>

                <div>

                    <h3 id="totalCount">
                        0
                    </h3>

                    <p>Total Tasks</p>

                </div>

            </div>


            <div class="stat-card pending">

                <div class="stat-icon">
                    🕐
                </div>

                <div>

                    <h3 id="pendingCount">
                        0
                    </h3>

                    <p>Pending</p>

                </div>

            </div>


            <div class="stat-card completed">

                <div class="stat-icon">
                    ✓
                </div>

                <div>

                    <h3 id="completedCount">
                        0
                    </h3>

                    <p>Completed</p>

                </div>

            </div>


            <div class="stat-card progress">

                <div class="stat-icon">
                    📈
                </div>

                <div>

                    <h3 id="progressCount">
                        0%
                    </h3>

                    <p>Progress</p>

                </div>

            </div>

        </section>


        <!-- ================= SEARCH & FILTER ================= -->

        <section class="filters">

            <div class="search-box">

                🔍

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search tasks..."
                >

            </div>


            <select id="filterCategory">

                <option value="all">
                    All Categories
                </option>

                <option value="Work">
                    Work
                </option>

                <option value="Study">
                    Study
                </option>

                <option value="Personal">
                    Personal
                </option>

                <option value="Health">
                    Health
                </option>

            </select>


            <select id="filterPriority">

                <option value="all">
                    All Priorities
                </option>

                <option value="High">
                    High
                </option>

                <option value="Medium">
                    Medium
                </option>

                <option value="Low">
                    Low
                </option>

            </select>


            <select id="statusFilter">

                <option value="all">
                    All Tasks
                </option>

                <option value="pending">
                    Pending
                </option>

                <option value="completed">
                    Completed
                </option>

            </select>

        </section>


        <!-- ================= TASK LIST ================= -->

        <section class="task-list">

            <div id="tasksContainer">

                <!-- JavaScript will create tasks here -->

            </div>


            <div id="emptyState"
                 class="empty-state">

                <div>
                    📝
                </div>

                <h3>
                    No tasks yet
                </h3>

                <p>
                    Add your first task and get started!
                </p>

            </div>

        </section>


    </main>


    <!-- ================= JAVASCRIPT ================= -->

    <script src="script.js"></script>

</body>

</html>
